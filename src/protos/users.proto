syntax = "proto3";

package user_management;

service UsersService {
  rpc FindCorrectAdmin (InputFindAdmin) returns (OutputFindAdmin);
  rpc FindBusinessUser(InputFindAdmin) returns (OutputFindAdmin);

}

message InputFindAdmin {
  string uuid = 1;
}

message OutputFindAdmin {
  string uuid = 1;
  string name = 2;

}
